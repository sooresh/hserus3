<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hserus3</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #0b0c10;
  color: #fff;
  margin: 0;
  padding: 20px;
}
h2 { text-align: center; margin-bottom: 10px; }
button {
  background: #1f8ef1;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 15px;
}
button:hover { background: #0d6efd; }
#progress { margin: 10px 0; font-size: 14px; text-align: center; }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid #333;
}
th {
  cursor: pointer;
  background: #1a1a1a;
  color: #00b4d8;
}
tr:hover { background: #1f1f1f; }
.green { color: #00ff9d; }
.red { color: #ff5c5c; }
</style>
</head>
<body>

<h2>hserus3</h2>
<div style="text-align:center;">
  <button onclick="startScanner()">🔄 Refresh</button>
</div>
<div id="progress"></div>

<table id="scannerTable">
  <thead>
    <tr>
      <th onclick="sortTable(0)">Symbol</th>
      <th onclick="sortTable(1)">Close%</th>
      <th onclick="sortTable(2)">Vol%</th>
      <th onclick="sortTable(3)">BB Check</th>
      <th onclick="sortTable(4)">SameClr</th>
      <th onclick="sortTable(5)">MidBand</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const API_BASE = "https://fapi.binance.com/fapi/v1";

async function getSymbols() {
  const res = await fetch(`${API_BASE}/exchangeInfo`);
  const data = await res.json();
  return data.symbols
    .filter(s => s.symbol.endsWith("USDT") && !s.symbol.includes("BUSD") && s.contractType === "PERPETUAL")
    .map(s => s.symbol);
}

// Simple volatility sort using 24h price change abs value
async function getTopVolatileSymbols(limit = 250) {
  const res = await fetch(`${API_BASE}/ticker/24hr`);
  const data = await res.json();
  let usdt = data.filter(x => x.symbol.endsWith("USDT") && x.contractType !== "CURRENT_QUARTER");
  usdt.sort((a,b) => Math.abs(parseFloat(b.priceChangePercent)) - Math.abs(parseFloat(a.priceChangePercent)));
  return usdt.slice(0, limit).map(x => x.symbol);
}

function calculateBB(values, period = 20, multiplier = 2) {
  if (values.length < period) return null;
  const slice = values.slice(-period);
  const avg = slice.reduce((a,b)=>a+b,0)/period;
  const variance = slice.reduce((a,b)=>a+Math.pow(b-avg,2),0)/period;
  const stdDev = Math.sqrt(variance);
  return {
    upper: avg + multiplier*stdDev,
    middle: avg,
    lower: avg - multiplier*stdDev
  };
}

function candleColor(c) {
  return c.close >= c.open ? "green" : "red";
}

async function getKlines(symbol) {
  const url = `${API_BASE}/klines?symbol=${symbol}&interval=1h&limit=22`;
  const res = await fetch(url);
  return await res.json();
}

function percentChange(curr, prev) {
  return ((curr - prev)/prev) * 100;
}

async function startScanner() {
  const tableBody = document.querySelector("#scannerTable tbody");
  tableBody.innerHTML = "";
  document.getElementById("progress").textContent = "Fetching symbols...";
  
  const symbols = await getTopVolatileSymbols(250);
  let results = [];

  let count = 0;
  for (let sym of symbols) {
    count++;
    document.getElementById("progress").textContent = `Scanning ${count} of ${symbols.length} (${sym})`;
    try {
      const data = await getKlines(sym);
      if (!data || data.length < 21) continue;

      const closes = data.map(x => parseFloat(x[4]));
      const vols = data.map(x => parseFloat(x[5]));
      const bb = calculateBB(closes);
      const prevBB = calculateBB(closes.slice(0, -1));
      if (!bb || !prevBB) continue;

      const len = data.length;
      const curr = data[len-1];
      const prev = data[len-2];
      const prev2 = data[len-3];

      const currClose = parseFloat(curr[4]);
      const prevClose = parseFloat(prev[4]);
      const currVol = parseFloat(curr[5]);
      const prevVol = parseFloat(prev[5]);
      const currHigh = parseFloat(curr[2]);
      const currLow = parseFloat(curr[3]);
      const prevHigh = parseFloat(prev[2]);
      const prevLow = parseFloat(prev[3]);
      const prev2High = parseFloat(prev2[2]);
      const prev2Low = parseFloat(prev2[3]);

      const isGreen = currClose >= parseFloat(curr[1]);
      const colorPrev = candleColor(prev);
      const colorPrev2 = candleColor(curr);

      // Conditions
      if (currVol <= prevVol) continue; // skip if vol not increased

      let cond2=false;
      if (isGreen) {
        cond2 = (currClose < bb.upper && prevHigh < prevBB.upper && prev2High < prevBB.upper);
      } else {
        cond2 = (currClose > bb.lower && prevLow > prevBB.lower && prev2Low > prevBB.lower);
      }
      if (!cond2) continue;

      const closeChg = percentChange(currClose, prevClose).toFixed(2);
      const volChg = percentChange(currVol, prevVol).toFixed(2);
      const bbCheck = isGreen ? (currHigh < bb.upper ? "Yes" : "No") : (currLow > bb.lower ? "Yes" : "No");
      const sameColor = (colorPrev === colorPrev2) ? "Yes" : "No";
      const midBand = currClose > bb.middle ? "Above" : "Below";

      results.push({
        symbol: sym,
        closeChg,
        volChg,
        bbCheck,
        sameColor,
        midBand
      });

    } catch (err) { console.log(sym, err.message); }
  }

  document.getElementById("progress").textContent = "Scan complete ✅";

  for (let r of results) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.symbol}</td>
      <td class="${r.closeChg>=0?'green':'red'}">${r.closeChg}</td>
      <td class="${r.volChg>=0?'green':'red'}">${r.volChg}</td>
      <td>${r.bbCheck}</td>
      <td>${r.sameColor}</td>
      <td>${r.midBand}</td>
    `;
    tableBody.appendChild(tr);
  }
}

// Sorting function
function sortTable(n) {
  const table = document.getElementById("scannerTable");
  let switching = true, dir = "asc", switchcount = 0;
  while (switching) {
    switching = false;
    const rows = table.rows;
    for (let i = 1; i < (rows.length - 1); i++) {
      let shouldSwitch = false;
      const x = rows[i].getElementsByTagName("TD")[n];
      const y = rows[i + 1].getElementsByTagName("TD")[n];
      let xVal = isNaN(x.innerText) ? x.innerText.toLowerCase() : parseFloat(x.innerText);
      let yVal = isNaN(y.innerText) ? y.innerText.toLowerCase() : parseFloat(y.innerText);
      if (dir === "asc" ? xVal > yVal : xVal < yVal) {
        shouldSwitch = true;
        break;
      }
    if (shouldSwitch) break;
    }
    if (shouldSwitch) {
      rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
      switching = true;
      switchcount++;
    } else if (switchcount === 0 && dir === "asc") {
      dir = "desc";
      switching = true;
    }
  }
}
</script>

</body>
</html>
