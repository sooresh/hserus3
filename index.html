<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hserus3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #12161c;
            color: #eaecef;
            padding: 20px;
        }

        .container {
            max-width: 1050px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 1.3rem;
            color: #f0b90b;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
            color: #848e9c;
        }

        select, button {
            background-color: #2b313a;
            color: #eaecef;
            border: 1px solid #474d57;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        select:focus, button:hover {
            border-color: #f0b90b;
        }

        button {
            background-color: #f0b90b;
            color: #000;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #d8a407;
        }

        button:disabled {
            background-color: #474d57;
            color: #848e9c;
            cursor: not-allowed;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 20px;
            background-color: #1e2329;
            padding: 15px;
            border-radius: 8px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #848e9c;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #2b313a;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: #f0b90b;
            transition: width 0.15s ease;
        }

        /* Table Styles */
        .table-container {
            background-color: #1e2329;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 16px;
            border-bottom: 1px solid #2b313a;
            font-size: 0.9rem;
        }

        th {
            background-color: #181a20;
            color: #848e9c;
            font-weight: 600;
            user-select: none;
        }

        th.sortable {
            cursor: pointer;
        }

        th.sortable:hover {
            color: #f0b90b;
        }

        tr:hover {
            background-color: #2b313a;
        }

        .text-green { color: #0ecb81; }
        .text-red { color: #f6465d; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #848e9c;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>hserus3</h1>
        <div class="controls">
            <label for="timeframe">TF:</label>
            <select id="timeframe">
                <option value="1h" selected>1h</option>
                <option value="4h">4h</option>
            </select>
            <button id="scanBtn" onclick="startScan()">Scan Now</button>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-info">
            <span id="progressText">Status: Ready</span>
            <span id="progressCount">0 / 250</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th class="sortable" onclick="sortTable('priceChg')">Price Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('volChg')">Vol Chg % ⇕</th>
                    <th class="sortable" onclick="sortTable('bbDistance')">BB Dist % ⇕</th>
                </tr>
            </thead>
            <tbody id="resultsTable">
                <tr>
                    <td colspan="4" class="empty-state">Click "Scan Now".</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let matchedResults = [];
    let currentSortColumn = '';
    let currentSortAsc = false;

    // Technical Analysis Calculation Helpers
    function calculateSMA(closes, period) {
        let sma = [];
        for (let i = 0; i < closes.length; i++) {
            if (i < period - 1) {
                sma.push(null);
                continue;
            }
            let sum = 0;
            for (let j = 0; j < period; j++) {
                sum += closes[i - j];
            }
            sma.push(sum / period);
        }
        return sma;
    }

    function calculateBollingerBands(closes, period = 20, stdDevMult = 2) {
        const sma = calculateSMA(closes, period);
        let upper = [];
        let lower = [];

        for (let i = 0; i < closes.length; i++) {
            if (i < period - 1) {
                upper.push(null);
                lower.push(null);
                continue;
            }
            let sumSquareDiffs = 0;
            for (let j = 0; j < period; j++) {
                sumSquareDiffs += Math.pow(closes[i - j] - sma[i], 2);
            }
            const stdDev = Math.sqrt(sumSquareDiffs / period);
            upper.push(sma[i] + (stdDev * stdDevMult));
            lower.push(sma[i] - (stdDev * stdDevMult));
        }

        return { upper, lower };
    }

    // Main Scanning Logic
    async function startScan() {
        const scanBtn = document.getElementById('scanBtn');
        const timeframeSelect = document.getElementById('timeframe');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const progressCount = document.getElementById('progressCount');
        const resultsTable = document.getElementById('resultsTable');

        const interval = timeframeSelect.value;

        // UI Reset
        scanBtn.disabled = true;
        matchedResults = [];
        resultsTable.innerHTML = '';
        progressBar.style.width = '0%';
        progressText.innerText = 'Fetching top 250 USDT perpetual pairs by volume...';
        progressCount.innerText = '0 / 250';

        try {
            // Fetch top 250 USDT Perpetual Futures by 24h Volume
            const tickerResponse = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            const tickers = await tickerResponse.json();

            const top250Symbols = tickers
                .filter(t => t.symbol.endsWith('USDT'))
                .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
                .slice(0, 250)
                .map(t => t.symbol);

            const batchSize = 10;
            const totalSymbols = top250Symbols.length;

            progressText.innerText = 'Scanning symbols...';

            // Process symbols in batches of 10
            for (let i = 0; i < totalSymbols; i += batchSize) {
                const batch = top250Symbols.slice(i, i + batchSize);

                const batchPromises = batch.map(async (symbol) => {
                    try {
                        // Request klines (limit 25 to safely calculate 20-period BB + previous index)
                        const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=25`);
                        const klines = await klineRes.json();

                        if (!klines || klines.length < 25) return null;

                        // Parse candle values
                        const opens = klines.map(k => parseFloat(k[1]));
                        const highs = klines.map(k => parseFloat(k[2]));
                        const lows = klines.map(k => parseFloat(k[3]));
                        const closes = klines.map(k => parseFloat(k[4]));
                        const volumes = klines.map(k => parseFloat(k[5]));

                        const currIdx = klines.length - 1;
                        const prevIdx = currIdx - 1;

                        const currVol = volumes[currIdx];
                        const prevVol = volumes[prevIdx];
                        const currOpen = opens[currIdx];
                        const currHigh = highs[currIdx];
                        const currLow = lows[currIdx];
                        const currClose = closes[currIdx];
                        const prevClose = closes[prevIdx];
                        const prevHigh = highs[prevIdx];
                        const prevLow = lows[prevIdx];

                        // --- Condition (1): Current volume > Prev volume * 1.4 ---
                        if (!(currVol > prevVol * 1.4)) return null;

                        const isGreen = currClose >= currOpen;
                        const isRed = !isGreen;

                        // --- Condition (2): Candle Wick Directional Rule ---
                        let upperWick = currHigh - Math.max(currOpen, currClose);
                        let lowerWick = Math.min(currOpen, currClose) - currLow;

                        if (isGreen && !(lowerWick > upperWick)) return null;
                        if (isRed && !(upperWick > lowerWick)) return null;

                        // Calculate Bollinger Bands
                        const bb = calculateBollingerBands(closes, 20, 2);
                        const prevUpperBB = bb.upper[prevIdx];
                        const prevLowerBB = bb.lower[prevIdx];
                        const currLowerBB = bb.lower[currIdx];
                        const currUpperBB = bb.upper[currIdx];

                        // --- Condition (3): Previous candle boundary validation ---
                        if (!(prevLow > prevLowerBB && prevHigh < prevUpperBB)) return null;

                        // --- Condition (4): Distance Checks ---
                        const bodyLength = Math.abs(currClose - currOpen);
                        let bbDistance = 0;

                        if (isGreen) {
                            bbDistance = currClose - currLowerBB;
                            const minRequiredDistPct = currClose * 0.015; // 1.5% of close
                            const minRequiredDistBody = bodyLength * 1.5;   // 1.5 times body length

                            if (!(bbDistance > minRequiredDistPct && bbDistance > minRequiredDistBody)) return null;
                        } else {
                            bbDistance = currUpperBB - currClose;
                            const minRequiredDistPct = currClose * 0.015; // 1.5% of close
                            const minRequiredDistBody = bodyLength * 1.5;   // 1.5 times body length

                            if (!(bbDistance > minRequiredDistPct && bbDistance > minRequiredDistBody)) return null;
                        }

                        // Dashboard metrics preparation
                        const priceChgPct = ((currClose - prevClose) / prevClose) * 100;
                        const volChgPct = ((currVol - prevVol) / prevVol) * 100;

                        return {
                            symbol: symbol,
                            priceChg: priceChgPct,
                            volChg: volChgPct,
                            bbDistance: bbDistance // close-to-lowerBB (green) or close-to-upperBB (red)
                        };

                    } catch (err) {
                        console.error(`Error scanning ${symbol}:`, err);
                        return null;
                    }
                });

                const batchResults = await Promise.all(batchPromises);

                batchResults.forEach(res => {
                    if (res !== null) matchedResults.push(res);
                });

                // Update Progress UI
                const scannedCount = Math.min(i + batchSize, totalSymbols);
                const percent = (scannedCount / totalSymbols) * 100;
                progressBar.style.width = `${percent}%`;
                progressCount.innerText = `${scannedCount} / ${totalSymbols}`;

                renderTable();
            }

            progressText.innerText = 'Scan Complete!';

        } catch (error) {
            console.error('Scan Error:', error);
            progressText.innerText = 'Scan interrupted. See console for details.';
        } finally {
            scanBtn.disabled = false;
        }
    }

    // Dashboard Table Rendering & Sorting
    function renderTable() {
        const resultsTable = document.getElementById('resultsTable');

        if (matchedResults.length === 0) {
            resultsTable.innerHTML = `<tr><td colspan="4" class="empty-state">No matching setups found.</td></tr>`;
            return;
        }

        let html = '';
        matchedResults.forEach(item => {
            const priceClass = item.priceChg >= 0 ? 'text-green' : 'text-red';
            const priceSign = item.priceChg >= 0 ? '+' : '';

            html += `
                <tr>
                    <td><strong>${item.symbol}</strong></td>
                    <td class="${priceClass}">${priceSign}${item.priceChg.toFixed(2)}%</td>
                    <td class="text-green">+${item.volChg.toFixed(1)}%</td>
                    <td>${item.bbDistance.toFixed(4)}</td>
                </tr>
            `;
        });

        resultsTable.innerHTML = html;
    }

    function sortTable(column) {
        if (matchedResults.length === 0) return;

        if (currentSortColumn === column) {
            currentSortAsc = !currentSortAsc;
        } else {
            currentSortColumn = column;
            currentSortAsc = false; // Default descending sort
        }

        matchedResults.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            return currentSortAsc ? valA - valB : valB - valA;
        });

        renderTable();
    }
</script>

</body>
</html>
